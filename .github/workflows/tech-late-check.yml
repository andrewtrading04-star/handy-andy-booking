name: Tech lateness check

# Alerts a late tech + staff (Heather/Joey) when a booking is 30+ minutes past
# its scheduled start and nobody tapped "On my way" yet. Runs every 10 minutes.
#
# NOT the primary trigger anymore — that's Vercel's own Cron (vercel.json),
# reliable now that the project is on Pro. This workflow is a redundant
# backup in case Vercel Cron ever has an outage; the endpoint is idempotent
# (metadata.tech_late_notified_ids / staff_late_notified_at) so both firing
# around the same time can never double-text anyone.
#
# Why it moved off being the primary: GitHub's own scheduler is best-effort
# for high-frequency crons, and it showed — measured over 98 runs, the real
# gap between runs averaged ~88 minutes (not 10), with a recurring nightly
# stretch over 200 minutes with no run at all. That's what was turning a
# "30 minutes late" alert into a text that actually arrived 90-105 minutes
# after the missed start. Left running here at 10 min anyway since a slow,
# unreliable backup still beats no backup, and it costs nothing extra.
#
# `concurrency` below makes overlapping runs QUEUE instead of running side by
# side — the endpoint's per-recipient send-then-mark isn't atomic, so two
# genuinely concurrent runs could both see a booking as unalerted and each
# send their own copy of every text before either one marks it done.
concurrency:
  group: tech-late-check
  cancel-in-progress: false
on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (UTC) — always the real thing, texts go out
  workflow_dispatch:          # manual "Run workflow" from the Actions tab — defaults to a
    inputs:                   # safe report-only test; uncheck the box to send real texts.
      dry:
        description: 'Dry run (report only — no texts sent)'
        type: boolean
        default: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger tech lateness check
        run: |
          DRY_PARAM=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry }}" != "false" ]; then
            DRY_PARAM="&dry=1"
          fi
          curl -fsS --retry 3 --retry-delay 5 -X GET \
            "https://handy-andy-booking.vercel.app/api/migrate?action=tech_late_check${DRY_PARAM}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
