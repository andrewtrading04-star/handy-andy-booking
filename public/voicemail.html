<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Voicemail</title>
<link rel="icon" href="/favicon-admin.svg">
<style>
  :root{
    --page:#0d1319; --card:#182029; --line:#2a3542;
    --tx:#eef2f6; --mute:#93a1b0; --blue:#2563EB; --green:#22c55e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--page);color:var(--tx);
    font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-text-size-adjust:100%;}
  .wrap{min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;
    padding:22px 16px calc(30px + env(safe-area-inset-bottom));}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
    width:100%;max-width:430px;padding:22px 20px 24px;
    box-shadow:0 16px 44px -26px #000;}
  .eyebrow{font:700 10px/1 sans-serif;letter-spacing:.15em;text-transform:uppercase;
    color:var(--mute);margin-bottom:12px;}
  h1{font-size:20px;line-height:1.3;margin:0 0 4px;letter-spacing:-.015em;}
  .when{font-size:13px;color:var(--mute);margin:0 0 18px;}
  .phone{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-bottom:14px;}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:20px;}
  .acts a{display:block;text-align:center;text-decoration:none;border-radius:11px;
    padding:14px 10px;font-size:15px;font-weight:700;}
  .acts a.call{background:var(--green);color:#06240f;}
  .acts a.text{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--tx);}
  .lbl{font:700 10px/1 sans-serif;letter-spacing:.13em;text-transform:uppercase;
    color:var(--mute);margin-bottom:8px;}
  .quote{background:rgba(255,255,255,.05);border:1px solid var(--line);border-left:3px solid var(--blue);
    border-radius:10px;padding:14px 15px;font-size:15px;line-height:1.6;white-space:pre-wrap;}
  .meta{margin-top:16px;font-size:12.5px;color:var(--mute);line-height:1.6;}
  .claimed{margin-top:16px;background:rgba(245,158,11,.13);border:1px solid rgba(245,158,11,.4);
    color:#fbbf24;border-radius:9px;padding:11px 13px;font-size:13px;line-height:1.5;}
  .err{color:#f2a7a7;font-size:14px;line-height:1.55;}
  .hide{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div id="loading"><div class="eyebrow">Voicemail</div><h1>Loading…</h1></div>

    <div id="view" class="hide">
      <div class="eyebrow" id="vEyebrow">New voicemail</div>
      <h1 id="vTitle">A customer left a message</h1>
      <p class="when" id="vWhen"></p>
      <div class="phone" id="vPhone"></div>
      <div class="acts">
        <a class="call" id="vCall" href="#">Call back</a>
        <a class="text" id="vText" href="#">Text</a>
      </div>
      <div id="vClaim" class="claimed hide"></div>
      <div class="lbl">What they said</div>
      <div class="quote" id="vQuote">No transcript was included.</div>
      <div class="meta" id="vMeta"></div>
    </div>

    <div id="bad" class="hide">
      <div class="eyebrow">Voicemail</div>
      <h1>Link expired</h1>
      <p class="err">Open the Calls tab in the dashboard to find this message.</p>
    </div>
  </div>
</div>

<script>
(function(){
  var token=new URLSearchParams(location.search).get('token')||'';
  var $=function(id){ return document.getElementById(id); };
  function show(id){ ['loading','view','bad'].forEach(function(s){ $(s).classList.toggle('hide', s!==id); }); }
  function prettyPhone(p){
    var d=String(p||'').replace(/\D/g,'');
    if(d.length===11&&d[0]==='1') d=d.slice(1);
    return d.length===10 ? '('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6) : (p||'');
  }
  if(!token) return show('bad');

  fetch('/api/book?action=vm_info&token='+encodeURIComponent(token))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d||!d.ok) return show('bad');
      $('vEyebrow').textContent = d.business ? ('New voicemail · '+d.business) : 'New voicemail';
      $('vTitle').textContent = 'Call them back';
      if(d.occurred_at){
        try{
          $('vWhen').textContent = new Date(d.occurred_at)
            .toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
        }catch(e){}
      }
      var pretty=prettyPhone(d.phone);
      $('vPhone').textContent = pretty || 'Number not captured';
      if(d.phone){
        $('vCall').href='tel:'+d.phone;
        $('vText').href='sms:'+d.phone;
      }else{
        $('vCall').classList.add('hide'); $('vText').classList.add('hide');
      }
      if(d.transcript) $('vQuote').textContent='“'+d.transcript+'”';
      var bits=[];
      if(d.service) bits.push(d.service);
      if(d.market) bits.push(d.market);
      $('vMeta').textContent = bits.join(' · ');
      if(d.claimed_by){
        $('vClaim').textContent = d.claimed_by+' is already calling this person back.';
        $('vClaim').classList.remove('hide');
      }
      show('view');
    })
    .catch(function(){ show('bad'); });
})();
</script>
</body>
</html>
