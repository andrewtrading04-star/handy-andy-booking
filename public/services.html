<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>What We Do</title>
<link rel="icon" href="/favicon-admin.svg">
<style>
  :root{
    --page:#0d1319; --card:#182029; --line:#2a3542;
    --tx:#eef2f6; --mute:#93a1b0; --accent:#FF6B35;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--page);color:var(--tx);
    font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-text-size-adjust:100%;}
  .wrap{min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;
    padding:22px 16px calc(30px + env(safe-area-inset-bottom));}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
    width:100%;max-width:460px;padding:24px 22px 26px;
    box-shadow:0 16px 44px -26px #000;}
  .eyebrow{font:700 10px/1 sans-serif;letter-spacing:.15em;text-transform:uppercase;
    color:var(--mute);margin-bottom:12px;}
  h1{font-size:21px;line-height:1.35;margin:0 0 8px;letter-spacing:-.015em;}
  .sub{font-size:14px;color:var(--mute);line-height:1.6;margin:0 0 22px;}
  .grp{margin-bottom:20px;}
  .grp-t{font:700 11px/1 sans-serif;letter-spacing:.08em;text-transform:uppercase;
    color:var(--accent);margin-bottom:10px;}
  .item{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:15px;
    border-bottom:1px solid var(--line);}
  .item:last-child{border-bottom:none;}
  .item .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;}
  .cta{display:block;text-align:center;text-decoration:none;border-radius:11px;
    padding:14px 10px;font-size:15px;font-weight:700;background:var(--accent);
    color:#0d1319;margin-top:22px;}
  .err{color:#f2a7a7;font-size:14px;line-height:1.55;}
  .hide{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div id="loading"><div class="eyebrow">What We Do</div><h1>Loading…</h1></div>

    <div id="view" class="hide">
      <div class="eyebrow" id="sEyebrow">What We Do</div>
      <h1 id="sTitle">Here's what we can help with</h1>
      <p class="sub">If your project is on this list, we'd love to help — just reach out or book online.</p>
      <div id="sGroups"></div>
      <a class="cta" id="sCta" href="#" target="_blank" rel="noopener">Get an estimate &rarr;</a>
    </div>

    <div id="bad" class="hide">
      <div class="eyebrow">What We Do</div>
      <h1>Couldn't load this page</h1>
      <p class="err">Give us a call and we can tell you directly what we handle.</p>
    </div>
  </div>
</div>

<script>
(function(){
  // Mirrors api/_lib/email.js EMAIL_BRANDS — kept in sync by hand since this is
  // a static page with no access to server config. Only cosmetic (accent color
  // + the "book online" link); the actual service list always comes live from
  // the server, so a stale brand entry here never shows wrong DATA, just a
  // slightly off color or a dead CTA link.
  var BRANDS={
    'handy-andy': { name:'Handy Andy', accent:'#FF6B35', website:'https://www.ihandyandy.com' },
    'doms':       { name:"Dom's TV Mounting", accent:'#2563EB', website:'https://www.domstvmounting.com' },
    'mile-high':  { name:'Mile High TV Mounting', accent:'#1D9E75', website:'https://www.milehightvmounting.com' },
  };
  var params=new URLSearchParams(location.search);
  var business=(params.get('business')||'handy-andy').trim();
  var brand=BRANDS[business]||BRANDS['handy-andy'];
  document.documentElement.style.setProperty('--accent', brand.accent);

  var $=function(id){ return document.getElementById(id); };
  function show(id){ ['loading','view','bad'].forEach(function(s){ $(s).classList.toggle('hide', s!==id); }); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  fetch('/api/admin?action=services_public&business='+encodeURIComponent(business))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d||!d.groups) return show('bad');
      var name=d.business_name||brand.name;
      $('sEyebrow').textContent=name+' · What We Do';
      $('sTitle').textContent="Here's what we can help with";
      $('sCta').textContent='Get an estimate from '+name+' →';
      $('sCta').href=brand.website;

      var cats=Object.keys(d.groups);
      if(!cats.length){
        $('sGroups').innerHTML='<p class="sub">Give us a call and we can tell you directly what we handle.</p>';
      }else{
        $('sGroups').innerHTML=cats.map(function(cat){
          var items=(d.groups[cat]||[]).map(function(name){
            return '<div class="item"><span class="dot"></span>'+esc(name)+'</div>';
          }).join('');
          return '<div class="grp"><div class="grp-t">'+esc(cat)+'</div>'+items+'</div>';
        }).join('');
      }
      show('view');
    })
    .catch(function(){ show('bad'); });
})();
</script>
</body>
</html>
