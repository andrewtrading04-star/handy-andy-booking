<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Booking confirmed</title>
<!--
  Hosted, brand-aware thank-you page.

  Why it lives here and not on each brand's own site: the microsite brands
  (Mile High, Precision) are LandingSite-hosted and have no real thank-you page
  of their own. Until 2026-08-20 widget.js pointed those slugs at
  /thankyou/ and /thank-you, which returned a genuine 404 — a customer who had
  just handed over a card got "page not found". That was stopgapped to each
  site's homepage, which is a real page but says nothing about the booking.

  Brands that DO have a real page on their own domain (handy-andy, doms,
  austin, tvmountingdenver) still redirect there. This page is only for the
  slugs that have nowhere else to land. See THANKYOU_URL in public/widget.js.

  Data comes from localStorage['ha_booking'], written by widget.js immediately
  before the redirect — never from the URL, so nothing about the customer or
  the price is exposed in a link, a referrer header, or an analytics hit.
-->
<style>
  :root{
    --bg:#f4f4f6; --card:#ffffff; --text:#18181c; --muted:#52525b;
    --line:#e4e4e8; --ok:#16a34a; --accent:#0288d1;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       padding:32px 16px}
  .wrap{max-width:560px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:28px 24px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .tick{width:60px;height:60px;border-radius:50%;background:rgba(22,163,74,.12);
        display:flex;align-items:center;justify-content:center;margin:0 auto 18px;
        font-size:30px;color:var(--ok)}
  h1{font-size:24px;margin:0 0 8px;text-align:center}
  .sub{color:var(--muted);text-align:center;margin:0 0 24px;font-size:15px}
  .biz{text-align:center;font-weight:600;color:var(--accent);margin:0 0 4px;font-size:14px;
       letter-spacing:.02em;text-transform:uppercase}
  .block{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}
  .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:4px}
  .val{font-weight:600}
  .row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:15px}
  .row .nm{color:var(--muted)}
  .total{display:flex;justify-content:space-between;border-top:1px solid var(--line);
         margin-top:12px;padding-top:12px;font-weight:700;font-size:18px}
  .note{color:var(--muted);font-size:14px;text-align:center;margin-top:22px}
  .back{display:block;text-align:center;margin-top:22px;color:var(--accent);
        text-decoration:none;font-weight:600}
  .back:hover{text-decoration:underline}
  @media (prefers-color-scheme:dark){
    :root{--bg:#0e0e10;--card:#18181c;--text:#fff;--muted:#a0a0ab;--line:#3f3f46}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="tick">&#10003;</div>
    <p class="biz" id="biz"></p>
    <h1 id="head">You're booked</h1>
    <p class="sub" id="sub">A confirmation email is on its way.</p>
    <div id="detail"></div>
    <p class="note">Need to change something? Just reply to your confirmation email.</p>
    <a class="back" id="back" href="#">Back to our site</a>
  </div>
</div>
<script>
(function(){
  // Keep in step with NATIVE_BUSINESS (api/_lib/native-businesses.js) and the
  // THANKYOU_URL map in widget.js. Only the slugs that actually land here need
  // an entry; anything else falls back to generic copy rather than guessing.
  var BRANDS = {
    'mile-high': { name:'Mile High TV Mounting',     site:'https://www.milehightvmounting.com/',        accent:'#2f7fd0' },
    'precision': { name:'Precision TV Installation', site:'https://www.precisiontvinstallation.com/',   accent:'#0288d1' },
    'houstonmounting':       { name:'Houston Mounting',         site:'https://houstonmounting.com/',       accent:'#0f766e' },
    'houstontvinstallation': { name:'Houston TV Installation',  site:'https://houstontvinstallation.com/', accent:'#b91c1c' },
    'tvhanginghouston':      { name:'TV Hanging Houston',       site:'https://tvhanginghouston.com/',      accent:'#6d28d9' },
    'htvmounting':           { name:'HTV Mounting',             site:'https://htvmounting.com/',           accent:'#166534' },
    'atxmountpros':          { name:'ATX Mount Pros',           site:'https://atxmountpros.com/',          accent:'#e8570a' },
    'atxtvmount':            { name:'ATX TV Mounting',          site:'https://atxtvmount.com/',            accent:'#1e56e0' },
    'austinmountingpros':    { name:'Austin Mounting Pros',     site:'https://austinmountingpros.com/',    accent:'#8a6a2c' },
    'austintvinstall':       { name:'Austin TV Installation',   site:'https://austintvinstall.com/',       accent:'#0d7a68' },
    'houstontvmountingpros':   { name:'H-Town TV Mounting',       site:'https://houstontvmountingpros.com/', accent:'#c9a25c' }
  };
  var slug  = new URLSearchParams(location.search).get('b') || '';
  var brand = BRANDS[slug] || null;

  if (brand) {
    document.documentElement.style.setProperty('--accent', brand.accent);
    document.getElementById('biz').textContent = brand.name;
    document.title = 'Booking confirmed | ' + brand.name;
    var back = document.getElementById('back');
    back.href = brand.site;
    back.textContent = 'Back to ' + brand.name;
  } else {
    document.getElementById('back').style.display = 'none';
  }

  var b = null;
  try { b = JSON.parse(localStorage.getItem('ha_booking') || 'null'); } catch (e) {}
  // Stale receipts: anything older than a day is almost certainly a revisit or
  // a shared browser, so show the plain confirmation instead of someone else's
  // (or a long-past) booking.
  if (b && b.ts && (Date.now() - b.ts) > 86400000) b = null;
  if (!b) return;

  if (b.firstName) document.getElementById('head').textContent = "You're booked, " + b.firstName;

  function money(n){
    return (n < 0 ? '-$' : '$') + Math.abs(Number(n) || 0).toFixed(2);
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  var html = '';
  if (b.dateLong || b.timeWindow) {
    html += '<div class="block"><div class="lbl">Appointment</div><div class="val">'
          + esc(b.dateLong || '')
          + (b.timeWindow ? '<br>' + esc(b.timeWindow) : '')
          + '</div></div>';
  }
  if (b.address || b.city || b.zip) {
    html += '<div class="block"><div class="lbl">Address</div><div class="val">'
          + esc(b.address || '') + '<br>'
          + esc([b.city, b.state].filter(Boolean).join(', ')) + ' ' + esc(b.zip || '')
          + '</div></div>';
  }
  if (b.lines && b.lines.length) {
    html += '<div class="block"><div class="lbl">Your service</div>';
    b.lines.forEach(function(l){
      // Widget writes {label, qty, amount}; tolerate the API's {name, quantity,
      // line_total} shape too so this page can't silently render "Item $0.00".
      var nm  = l.label != null ? l.label : (l.name || 'Item');
      var qty = l.qty  != null ? l.qty   : (l.quantity || 1);
      var amt = l.amount != null ? l.amount : (l.line_total || 0);
      html += '<div class="row"><span class="nm">' + esc(nm)
            + (qty > 1 ? ' &times;' + esc(qty) : '')
            + '</span><span>' + money(amt) + '</span></div>';
    });
    if (b.tip > 0) {
      html += '<div class="row"><span class="nm">Tip</span><span>' + money(b.tip) + '</span></div>';
    }
    html += '<div class="total"><span>Total</span><span>'
          + money((Number(b.total) || 0) + (Number(b.tip) || 0)) + '</span></div></div>';
  }
  document.getElementById('detail').innerHTML = html;
})();
</script>
</body>
</html>
